org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation breaks when plugin sources (C:\Users\...\Pub\Cache)
# and the project (E:\) live on different drives. Disable it for reliable builds.
kotlin.incremental=false
# tflite_flutter compiles its Java sources at JVM 11 while this project's Kotlin
# plugin defaults to a newer target. Newer Gradle versions hard-fail on that
# third-party mismatch; treat it as a warning so the plugin compiles normally.
kotlin.jvm.target.validation.mode=warning
